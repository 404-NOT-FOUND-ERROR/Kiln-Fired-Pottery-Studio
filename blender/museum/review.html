</style></head><body><main><img class="scene" src="museum-final.png" alt="暖色聚光照亮青釉陶罐，粗石展台与暗色展厅形成纵深"><div class="shade"></div><header><a class="brand" href="../../index.html">懂了鸭 <small>/ 窑变陶艺</small></a><span class="edition">BLENDER · 场景试作 01</span></header><div class="verse">土与火之间<br>自有容染</div><section class="caption"><p class="eyebrow">一次窑火，只此一件</p><h1>青岚流光</h1><div class="rule"></div><p class="recipe">小罐 · 天青釉 · 窑变意象</p><p class="poem">窑火过后，<br>山岚与天色，在釉中相遇。</p><div class="actions"><button id="showDetail">查看釉面 ↗</button><a href="museum-scene.blend" download>下载场景 ↓</a></div></section><footer class="foot"><div><b>藏品</b><p>THE GALLERY / 光影之间，自成一席</p></div><p class="technical">静帧渲染 · 非实时三维页面<br><a href="museum-final.png" target="_blank">1920 × 1080 场景原图 ↗</a></p></footer></main><dialog id="detail"><img src="glaze-detail.png" alt="陶器釉面与开片纹理特写"><form method="dialog"><span>釉面特写 / 艺术化材质试作</span><button>关闭 ×</button></form></dialog><script>const dialog=document.querySelector('#detail');document.querySelector('#showDetail').onclick=()=>dialog.showModal();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});</script></body></html>
